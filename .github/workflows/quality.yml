name: Portfolio quality gate

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  build-test:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build
      - run: npm run check:build
      - run: npm run check:components
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: projects/applied-ai/ml/requirements.txt
      - run: python -m pip install -r projects/applied-ai/ml/requirements.txt
      - name: Python model-training and parity regression checks
        working-directory: projects/applied-ai/ml
        run: python -m unittest discover -p 'test_*.py'
